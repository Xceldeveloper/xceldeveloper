# Nuxt 4 / @clack need Node 20.12+ (styleText). Pin 22 to match package.json engines.
[build.environment]
  NODE_VERSION = "22"
  # Index when this is the production deploy; *.netlify.app stays noindex in app robots.
  NUXT_PUBLIC_ALLOW_INDEXING = "true"

# Send Netlify subdomains to the real domain (helps Google drop them).
# Keep the old site name so leftover Google listings still 301 after rename.
[[redirects]]
  from = "/*"
  to = "https://overcomeremiator.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["overcomeremiator.netlify.app", "xceldeveloper.netlify.app"]}
